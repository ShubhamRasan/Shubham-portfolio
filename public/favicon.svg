<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c" />
      <stop offset="50%" stop-color="#101013" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <linearGradient id="fav-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="fav-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="fav-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="fav-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Squircle with High-Contrast Rim -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#fav-bg)" stroke="url(#fav-border)" stroke-width="3" />

  <!-- Monogram Glyph Group -->
  <g filter="url(#fav-shadow)">
    <!-- Letter 'S' Ribbon -->
    <path 
      d="M 44 26 L 28 26 C 21 26 17 30 17 37 L 17 40 C 17 46 22 50 28 50 L 38 50 C 44 50 49 54 49 60 L 49 63 C 49 70 45 74 38 74 L 20 74" 
      fill="none" 
      stroke="url(#fav-metal)" 
      stroke-width="8.5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Letter 'R' Vertical Spine -->
    <path 
      d="M 54 26 L 54 74" 
      stroke="url(#fav-metal)" 
      stroke-width="8.5" 
      stroke-linecap="round" 
    />

    <!-- Letter 'R' Upper Bowl -->
    <path 
      d="M 54 26 L 71 26 C 79 26 83 31 83 38 C 83 45 79 50 71 50 L 54 50" 
      fill="none" 
      stroke="url(#fav-metal)" 
      stroke-width="8.5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Letter 'R' Dynamic Kick Slash with Neon Gradient -->
    <path 
      d="M 67 50 L 83 74" 
      stroke="url(#fav-accent)" 
      stroke-width="9" 
      stroke-linecap="round" 
    />

    <!-- Focal Aperture Point -->
    <circle cx="66" cy="38" r="3" fill="#38bdf8" />
  </g>
</svg>
